<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disconnect-vs-Billing Detector</title>
<style>
/* =========================================================================
   THEME TOKENS (light default; dark via prefers-color-scheme or the toggle)
   ========================================================================= */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f7f9fb; --surface-3:#eef2f6;
  --border:#dfe5ec; --border-strong:#c6d0da;
  --text:#14202b; --muted:#566576; --faint:#8794a3;
  --accent:#0a6c8c; --accent-hover:#085a75; --accent-soft:#e2f0f5; --accent-ink:#ffffff;
  --high:#b42318; --high-bg:#fdecea; --med:#9a5a06; --med-bg:#fdf1d8; --low:#1d5fae; --low-bg:#e6effb;
  --review:#6b3fb0; --review-bg:#efe8fb;
  --pass:#16794a; --pass-bg:#e2f4ea; --fail:#b42318; --fail-bg:#fdecea;
  --actual:#3a7fc1; --est:#e0912a; --zero:#9aa7b4;
  --band-a:#f4f7fa; --band-b:#e9eef4; --win:#b42318;
  --m-disc:#b42318; --m-rec:#16794a; --m-bill:#6b3fb0; --m-stop:#9a5a06;
  --sys-oms:#0a6c8c; --sys-ccb:#6b3fb0; --sys-mdm:#9a5a06; --sys-xw:#4b5b6b; --sys-int:#b42318; --sys-crm:#16794a; --sys-gl:#1d5fae;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 16px 40px rgba(16,24,40,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1218; --surface:#141b23; --surface-2:#18212b; --surface-3:#1e2833;
    --border:#263240; --border-strong:#36455a;
    --text:#e4ebf2; --muted:#9aa8b7; --faint:#6f7e8e;
    --accent:#3fa7c9; --accent-hover:#5cb9d8; --accent-soft:rgba(63,167,201,.15); --accent-ink:#04141b;
    --high:#ff8a7a; --high-bg:rgba(255,138,122,.14); --med:#f3b25b; --med-bg:rgba(243,178,91,.14); --low:#86b6f2; --low-bg:rgba(134,182,242,.14);
    --review:#bb9df2; --review-bg:rgba(187,157,242,.15);
    --pass:#5fd39a; --pass-bg:rgba(95,211,154,.13); --fail:#ff8a7a; --fail-bg:rgba(255,138,122,.14);
    --actual:#5b9ee0; --est:#f0a640; --zero:#5d6b7a;
    --band-a:#161e27; --band-b:#1c2631; --win:#ff8a7a;
    --m-disc:#ff8a7a; --m-rec:#5fd39a; --m-bill:#bb9df2; --m-stop:#f3b25b;
    --sys-oms:#3fa7c9; --sys-ccb:#bb9df2; --sys-mdm:#f3b25b; --sys-xw:#9aa8b7; --sys-int:#ff8a7a; --sys-crm:#5fd39a; --sys-gl:#86b6f2;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#141b23; --surface-2:#18212b; --surface-3:#1e2833;
  --border:#263240; --border-strong:#36455a;
  --text:#e4ebf2; --muted:#9aa8b7; --faint:#6f7e8e;
  --accent:#3fa7c9; --accent-hover:#5cb9d8; --accent-soft:rgba(63,167,201,.15); --accent-ink:#04141b;
  --high:#ff8a7a; --high-bg:rgba(255,138,122,.14); --med:#f3b25b; --med-bg:rgba(243,178,91,.14); --low:#86b6f2; --low-bg:rgba(134,182,242,.14);
  --review:#bb9df2; --review-bg:rgba(187,157,242,.15);
  --pass:#5fd39a; --pass-bg:rgba(95,211,154,.13); --fail:#ff8a7a; --fail-bg:rgba(255,138,122,.14);
  --actual:#5b9ee0; --est:#f0a640; --zero:#5d6b7a;
  --band-a:#161e27; --band-b:#1c2631; --win:#ff8a7a;
  --m-disc:#ff8a7a; --m-rec:#5fd39a; --m-bill:#bb9df2; --m-stop:#f3b25b;
  --sys-oms:#3fa7c9; --sys-ccb:#bb9df2; --sys-mdm:#f3b25b; --sys-xw:#9aa8b7; --sys-int:#ff8a7a; --sys-crm:#5fd39a; --sys-gl:#86b6f2;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* =========================================================================
   BASE & LAYOUT
   ========================================================================= */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
[hidden]{display:none !important}

.app-header{background:var(--surface);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.header-right{display:flex;align-items:center;gap:10px;min-width:0}
.source-line{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--surface-3);border:1px solid var(--border);padding:4px 10px;border-radius:8px;min-width:0;max-width:640px}
.source-line .path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Consolas,monospace}
.source-line b{color:var(--text);white-space:nowrap}

.controls{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.controls-inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-top:10px;padding-bottom:10px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.seg{display:inline-flex;background:var(--surface-3);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:550;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow);outline:1px solid var(--border)}
input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--border-strong);border-radius:7px;padding:5px 8px;font-size:13px}
input[type=date]:disabled{opacity:.45}
input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:550;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:34px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(14px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.run-group{display:flex;align-items:center;gap:8px;margin-left:auto}
.run-status{font-size:12.5px;color:var(--muted);min-width:200px}
.run-status .ok{color:var(--pass);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:disabled{opacity:.75;cursor:progress}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.spinner{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-top:18px;padding-bottom:48px}

.banner{display:flex;align-items:flex-start;gap:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.banner.warn{background:var(--med-bg);border-color:color-mix(in srgb,var(--med) 40%,transparent)}
.banner .b-icon{color:var(--accent);flex:none;margin-top:1px}
.banner.warn .b-icon{color:var(--med)}
.banner .b-text{flex:1}
.banner .b-close{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-value{font-size:24px;font-weight:680;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.emph{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.kpi.emph .k-value{color:var(--accent)}
.kpi.warn .k-value{color:var(--high)}
.kpi.dim .k-value{color:var(--faint)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.t-badge{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:700}
.t-badge.pass{background:var(--pass-bg);color:var(--pass)}
.t-badge.fail{background:var(--fail-bg);color:var(--fail)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-head h2{font-size:15px;margin:0;font-weight:650}
.card-head .count{color:var(--muted);font-weight:500;margin-left:6px}
.card-head .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-body{padding:14px 16px}
.card-foot{padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}

.table-wrap{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13px}
.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.grid th.sortable{cursor:pointer;user-select:none}
.grid th.sortable:hover{color:var(--text)}
.grid th .arrow{font-size:10px;margin-left:3px;opacity:.8}
.grid td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid td.r,.grid th.r{text-align:right}
.grid tbody tr.clickable{cursor:pointer}
.grid tbody tr.clickable:hover td{background:var(--surface-2)}
.grid tr.total td{font-weight:650;background:var(--surface-2)}
.grid .sub-line{font-size:11.5px;color:var(--faint);margin-top:1px}
.grid.compact td,.grid.compact th{padding:6px 9px}

.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.sev-HIGH,.sev-HOLD,.st-ERROR{background:var(--high-bg);color:var(--high)}
.sev-MEDIUM,.st-SKIPPED{background:var(--med-bg);color:var(--med)}
.sev-LOW{background:var(--low-bg);color:var(--low)}
.sev-REVIEW,.sev-C3{background:var(--review-bg);color:var(--review)}
.st-SUCCESS{background:var(--pass-bg);color:var(--pass)}
.st-NONE{background:var(--surface-3);color:var(--muted)}
.rule{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--surface-3);border:1px solid var(--border);margin:0 3px 3px 0}
.case-tag{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--text);color:var(--surface);margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.case-tag.n{background:var(--pass);color:var(--surface)}
.sys{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;border:1px solid currentColor;letter-spacing:.03em;white-space:nowrap}
.sys-OMS{color:var(--sys-oms)} .sys-CCB{color:var(--sys-ccb)} .sys-MDM{color:var(--sys-mdm)} .sys-XWALK{color:var(--sys-xw)} .sys-INT{color:var(--sys-int)} .sys-CRM{color:var(--sys-crm)} .sys-GL{color:var(--sys-gl)} .sys-KEY{color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:2px;text-align:left}
.linkish:hover{text-decoration-color:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters label{font-size:12px;color:var(--muted);font-weight:600}

details.legend summary{cursor:pointer;font-weight:600;padding:12px 16px;list-style:none}
details.legend summary::-webkit-details-marker{display:none}
details.legend summary::before{content:"▸ ";color:var(--muted)}
details.legend[open] summary::before{content:"▾ "}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px;padding:0 16px 14px;font-size:13px}
@media (max-width:820px){.legend-grid{grid-template-columns:1fr}}
.legend-grid dt{font-weight:650}
.legend-grid dd{margin:0 0 6px;color:var(--muted)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(8,14,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1000px,100vw);background:var(--bg);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer-head{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;gap:14px;align-items:flex-start}
.drawer-head .eyebrow{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.drawer-head h2{margin:2px 0 3px;font-size:19px;font-weight:680}
.drawer-head .meta{font-size:12.5px;color:var(--muted)}
.drawer-head .close{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;color:var(--muted);flex:none}
.drawer-body{overflow:auto;padding:16px 20px 40px}
.drawer h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 8px}
.action-box{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.action-box strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:3px}
.action-box p{margin:0;font-size:14px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.mini div{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.mini span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 10px 6px}
.tl svg{width:100%;height:auto;display:block}
.tl text{fill:var(--muted);font-size:10.5px;font-family:inherit}
.tl .t-strong{fill:var(--text);font-weight:600}
.tl .band-a{fill:var(--band-a)} .tl .band-b{fill:var(--band-b)}
.tl .band-hit{stroke:var(--high);stroke-width:1;stroke-dasharray:3 3}
.tl .hatch-line{stroke:var(--win);stroke-width:1.6;opacity:.32}
.tl .win-edge{stroke:var(--win);opacity:.6}
.tl .bar-a{fill:var(--actual)} .tl .bar-e{fill:var(--est)} .tl .bar-z{fill:var(--zero)}
.tl .axis{stroke:var(--border-strong);stroke-width:1}
.tl .grid-l{stroke:var(--border);stroke-width:1;stroke-dasharray:2 3}
.tl .mk{stroke-width:1.6}
.tl .mk-disc{stroke:var(--m-disc)} .tl .mk-rec{stroke:var(--m-rec)} .tl .mk-bill{stroke:var(--m-bill);stroke-dasharray:4 3} .tl .mk-stop{stroke:var(--m-stop)}
.tl .lb-disc{fill:var(--m-disc)} .tl .lb-rec{fill:var(--m-rec)} .tl .lb-bill{fill:var(--m-bill)} .tl .lb-stop{fill:var(--m-stop)}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:6px 6px 2px}
.tl-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.tl-legend i.line{width:14px;height:0;border-top:2px solid;border-radius:0;vertical-align:3px}
.tl-legend i.dash{border-top-style:dashed}
.rule-list{display:grid;gap:6px}
.rule-list div{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px}
.crm-list{display:grid;gap:8px}
.crm-list details{background:var(--surface);border:1px solid var(--border);border-radius:8px}
.crm-list summary{cursor:pointer;padding:8px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
.crm-list summary::-webkit-details-marker{display:none}
.crm-list summary::before{content:"▸";color:var(--muted)}
.crm-list details[open] summary::before{content:"▾"}
.crm-list .crm-notes{padding:0 12px 10px 30px;font-size:13px;color:var(--muted);white-space:pre-wrap}

/* Self-test */
.matrix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:980px){.matrix{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mx{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.mx:hover{border-color:var(--border-strong)}
.mx.current{outline:2px solid var(--accent)}
.mx .mx-title{font-size:12.5px;font-weight:650;color:var(--muted)}
.mx .mx-res{font-size:20px;font-weight:750;margin-top:3px}
.mx .mx-res.pass{color:var(--pass)} .mx .mx-res.fail{color:var(--fail)} .mx .mx-res.na{color:var(--faint)}
.res{font-weight:750;font-size:12px;padding:2px 8px;border-radius:6px}
.res.pass{background:var(--pass-bg);color:var(--pass)}
.res.fail{background:var(--fail-bg);color:var(--fail)}
.overall{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:16px;font-weight:650;flex-wrap:wrap}
.overall.pass{background:var(--pass-bg);color:var(--pass);border:1px solid color-mix(in srgb,var(--pass) 35%,transparent)}
.overall.fail{background:var(--fail-bg);color:var(--fail);border:1px solid color-mix(in srgb,var(--fail) 35%,transparent)}
.overall .o-big{font-size:22px}
.overall .o-sub{font-weight:500;color:var(--text);opacity:.85;font-size:13px}

/* Loading / offline / errors */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px;max-width:860px;margin:24px auto}
.panel h2{margin:0 0 8px;font-size:18px}
.panel p{margin:8px 0;color:var(--muted)}
.panel pre{background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;overflow:auto;font-size:12.5px}

<script>
'use strict';
/* === ENGINE START === (sections 1–5 have no DOM dependencies; testable outside the browser) */

/* =========================================================================
   SECTION 1 — UTILITIES: rounding, dates, string distance, formatting
   ========================================================================= */
const money  = x => Math.round((x + 1e-9) * 100) / 100;   // round to cents
const round1 = x => Math.round((x + 1e-9) * 10) / 10;     // kWh to 0.1
const num    = s => (s === '' || s == null ? 0 : Number(s));
const MS_DAY = 86400000;
const toUTC = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
const fromUTC = t => new Date(t).toISOString().slice(0, 10);
const addDays = (d, n) => fromUTC(toUTC(d) + n * MS_DAY);
const daysBetween = (a, b) => Math.round((toUTC(b) - toUTC(a)) / MS_DAY);
const dateOf = ts => (ts || '').slice(0, 10);
const maxStr = (a, b) => (a > b ? a : b);
const minStr = (a, b) => (a < b ? a : b);
function dayRange(a, b) {
  const out = [];
  for (let t = toUTC(a), e = toUTC(b); t <= e; t += MS_DAY) out.push(fromUTC(t));
  return out;
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
/** Treat look-alike characters as equal: letter O ≡ zero, letter I ≡ one. */
const foldLookalikes = s => s.toUpperCase().replace(/O/g, '0').replace(/I/g, '1');
const fmtMoney = n => (n < -0.004 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtKwh = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 });
const fmtTs = ts => ts || '—';
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* =========================================================================
   SECTION 2a — CSV PARSING & SCHEMA VALIDATION
   ========================================================================= */
/**
 * RFC-4180-style parser: header row, CRLF or LF, quoted fields with commas, doubled quotes ("") and
 * embedded line breaks. Nothing inside quotes is trimmed. Returns { headers, rows, issues }.
 */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);            // strip UTF-8 BOM
  const records = [];
  let row = [], field = '', inQuotes = false, i = 0;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }   // escaped quote
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;                                        // includes commas and line breaks
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r' || c === '\n') {
      row.push(field); records.push(row); row = []; field = '';
      i += (c === '\r' && text[i + 1] === '\n') ? 2 : 1;
      continue;
    }
    field += c; i++;
  }
  if (field !== '' || row.length) { row.push(field); records.push(row); }
  const issues = [];
  if (inQuotes) issues.push('file ends inside a quoted field (unbalanced quote)');
  const recs = records.filter(r => !(r.length === 1 && r[0] === ''));  // ignore blank lines
  const headers = (recs.shift() || []).map(h => h.trim());
  const rows = [];
  let ragged = 0;
  for (const r of recs) {
    if (r.length !== headers.length) ragged++;
    const o = {};
    for (let j = 0; j < headers.length; j++) o[headers[j]] = r[j] !== undefined ? r[j] : '';
    rows.push(o);
  }
  if (ragged) issues.push(`${ragged} record(s) have a different number of fields than the header`);
  return { headers, rows, issues };
}

/** Expected files and exact column headers. `core` files are needed for detection. */
const SCHEMA = {
  'ccb_accounts.csv':            { sys: 'CCB',   core: true,  cols: ['account_id','customer_name','customer_class','mailing_address','account_status','created_date'] },
  'ccb_service_agreements.csv':  { sys: 'CCB',   core: true,  cols: ['sa_id','account_id','ccb_sp_id','premise_address','tariff_code','sa_status','start_date','stop_date','stop_processed_at'] },
  'ccb_bill_segments.csv':       { sys: 'CCB',   core: true,  cols: ['bill_id','sa_id','bill_type','period_start','period_end','bill_run_at','days_billed','kwh_billed','usage_quality','rate_per_kwh','consumption_amount','fixed_daily_charge','fixed_amount','total_amount','bill_status'] },
  'ccb_tariffs.csv':             { sys: 'CCB',   core: true,  cols: ['tariff_code','description','rate_per_kwh','fixed_daily_charge','fixed_stops_on_stop_service','fixed_continues_on_nonpay'] },
  'ccb_todo_entries.csv':        { sys: 'CCB',   core: true,  cols: ['todo_id','created_at','todo_type','related_entity','sa_id','message','priority','status','assigned_to'] },
  'mdm_meters.csv':              { sys: 'MDM',   core: true,  cols: ['mdm_meter_id','mdm_sp_id','meter_type','connection_state','connection_state_updated_at'] },
  'mdm_daily_reads.csv':         { sys: 'MDM',   core: true,  cols: ['read_id','mdm_meter_id','read_date','kwh','read_quality','vee_rule'] },
  'oms_work_orders.csv':         { sys: 'OMS',   core: true,  cols: ['wo_id','oms_premise_id','wo_type','wo_subtype','status','created_at','completed_at','technician_id','notes'] },
  'integration_message_log.csv': { sys: 'INT',   core: true,  cols: ['msg_id','source_system','target_system','message_type','wo_id','oms_premise_id','received_at','processed_at','status','retry_count','error_message'] },
  'ref_id_crosswalk.csv':        { sys: 'XWALK', core: true,  cols: ['oms_premise_id','ccb_sp_id','mdm_meter_id'] },
  'crm_cases.csv':               { sys: 'CRM',   core: false, cols: ['case_id','account_id','customer_name','opened_at','channel','category','subject','status','closed_at','billing_hold_set','linked_case_id','notes'] },
  'gl_journal_lines.csv':        { sys: 'GL',    core: false, cols: ['je_id','je_line','posting_date','accounting_period','gl_account','gl_account_name','debit','credit','source_system','source_ref','sa_id','description'] },
  'gl_periods.csv':              { sys: 'GL',    core: false, cols: ['accounting_period','status','closed_at'] },
  'answer_key.csv':              { sys: 'KEY',   core: false, cols: ['case','customer_name','back_scan_result','severity','phantom_kwh_billed','credit_consumption','credit_fixed','credit_total','cause_and_notes','daily_check_2026_11_02'] },
};
const FILE_NAMES = Object.keys(SCHEMA);
const SYS_NAME = { OMS: 'OMS', CCB: 'CC&B', MDM: 'MDM', XWALK: 'Master data', INT: 'Integration', CRM: 'CRM', GL: 'GL', KEY: 'Test oracle' };

/** Check every expected file and column. Errors block detection; warnings only disable features. */
function validateFiles(files) {
  const errors = [], warnings = [];

    const missingCols = spec.cols.filter(c => !f.headers.includes(c) &&
      !(name === 'answer_key.csv' && c.startsWith('daily_check_') && f.headers.some(h => /^daily_check_\d{4}_\d{2}_\d{2}$/.test(h))));
    if (missingCols.length) (spec.core ? errors : warnings).push(`${name}: missing column(s) ${missingCols.join(', ')}`);
    for (const iss of f.issues || []) warnings.push(`${name}: ${iss}`);
    if (spec.core && !f.rows.length) errors.push(`${name} has no data rows`);
  }
  return { errors, warnings };
}

/* =========================================================================
   SECTION 3 — INDEXING & DETECTION RULES
   ========================================================================= */
const STOP_SUBTYPES = new Set(['STOP_SERVICE', 'MOVE_OUT']);   // subtypes that should stop the SA
const RULES = {
  R1: 'A bill covers post-disconnect days',
  R2: 'Estimated reads post-disconnect',
  R5: 'SA ACTIVE despite a STOP_SERVICE/MOVE_OUT disconnect',
  RT: 'Bill run after the disconnect but before stop_processed_at',
  RV: 'Consumption recorded after the disconnect',
};
const CAUSE_TEXT = {
  C1: 'No integration mapping — the OMS completion was never turned into a CC&B stop.',
  C2: 'Integration failure — the stop message errored and the CC&B To Do was not worked.',
  C3: 'ID mismatch — the OMS premise does not resolve through the ID cross-reference.',
  C6: 'Timing race — the bill ran before CC&B processed the stop.',
  'C4 + C5': 'Non-pay disconnect keeps the SA active by design, and MDM estimated usage while the meter was off.',
  TAMPER: 'Possible failed disconnect or tamper — actual consumption recorded after the disconnect.',
  NOMSG: 'No integration message found for this work order.',
  OTHER: 'Unclassified — manual review.',
};
const CAUSE_FILTER_LABEL = { C1: 'C1 — no mapping', C2: 'C2 — integration failure', C3: 'C3 — ID mismatch', C6: 'C6 — timing race',
  'C4 + C5': 'C4 + C5 — non-pay', TAMPER: 'Failed disconnect / tamper', NOMSG: 'No integration message', OTHER: 'Unclassified' };
const SEV_RANK = { HIGH: 4, MEDIUM: 3, LOW: 2, REVIEW: 1 };

/** Index all tables by their join keys. Called once per dataset load. */
function buildIndex(files) {
  const rows = n => (files[n] ? files[n].rows : []);
  const ix = {
    accountById: {}, tariff: {}, xwByPremise: {}, sasBySp: {}, saById: {}, billsBySa: {}, meterById: {},
    readsByMeter: {}, wosByPremise: {}, msgsByWo: {}, todosByEntity: {}, todosBySa: {}, crmByAccount: {},
    glByRef: {}, periodByKey: {}, minRead: null, maxRead: null, minBill: null, maxBill: null, cadence: null,
  };
  for (const a of rows('ccb_accounts.csv')) ix.accountById[a.account_id] = a;
  for (const t of rows('ccb_tariffs.csv')) ix.tariff[t.tariff_code] = t;
  for (const x of rows('ref_id_crosswalk.csv')) ix.xwByPremise[x.oms_premise_id] = x;
  for (const s of rows('ccb_service_agreements.csv')) { (ix.sasBySp[s.ccb_sp_id] ||= []).push(s); ix.saById[s.sa_id] = s; }
  for (const b of rows('ccb_bill_segments.csv')) {
    (ix.billsBySa[b.sa_id] ||= []).push(b);
    ix.minBill = ix.minBill ? minStr(ix.minBill, b.period_start) : b.period_start;
    ix.maxBill = ix.maxBill ? maxStr(ix.maxBill, b.period_end) : b.period_end;
  }
  for (const m of rows('mdm_meters.csv')) ix.meterById[m.mdm_meter_id] = m;
  for (const r of rows('mdm_daily_reads.csv')) {
    r._kwh = num(r.kwh);
    (ix.readsByMeter[r.mdm_meter_id] ||= {})[r.read_date] = r;
    ix.minRead = ix.minRead ? minStr(ix.minRead, r.read_date) : r.read_date;
    ix.maxRead = ix.maxRead ? maxStr(ix.maxRead, r.read_date) : r.read_date;
  }
  for (const w of rows('oms_work_orders.csv')) (ix.wosByPremise[w.oms_premise_id] ||= []).push(w);
  for (const m of rows('integration_message_log.csv')) (ix.msgsByWo[m.wo_id] ||= []).push(m);
  for (const t of rows('ccb_todo_entries.csv')) { (ix.todosByEntity[t.related_entity] ||= []).push(t); if (t.sa_id) (ix.todosBySa[t.sa_id] ||= []).push(t); }
  for (const c of rows('crm_cases.csv')) (ix.crmByAccount[c.account_id] ||= []).push(c);
  for (const g of rows('gl_journal_lines.csv')) (ix.glByRef[g.source_ref] ||= []).push(g);
  for (const p of rows('gl_periods.csv')) ix.periodByKey[p.accounting_period] = p;
  ix.cadence = inferBillCadence(rows('ccb_bill_segments.csv'));
  return ix;
}

/** Regular bill runs happen on a fixed day/time each month; learn it from the data (mode of REGULAR runs). */
function inferBillCadence(bills) {
  const counts = {};
  for (const b of bills) if (b.bill_type === 'REGULAR' && b.bill_run_at) { const k = b.bill_run_at.slice(8); counts[k] = (counts[k] || 0) + 1; }
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return best ? { day: +best[0].slice(0, 2), time: best[0].slice(3, 8) } : null;
}
/** Next expected regular bill run strictly after the end of the as-of day. */
function nextBillRun(ix, asOf) {
  if (!ix.cadence) return null;
  let y = +asOf.slice(0, 4), m = +asOf.slice(5, 7);
  for (let k = 0; k < 3; k++) {
    const ts = `${y}-${String(m).padStart(2, '0')}-${String(ix.cadence.day).padStart(2, '0')} ${ix.cadence.time}`;
    if (ts > asOf + ' 23:59') return ts;
    m++; if (m > 12) { m = 1; y++; }
  }
  return null;
}

/** Step 2: OMS premise → crosswalk → CC&B service point (all SAs on it) + MDM meter. */
function resolvePremise(ix, premise, onDate) {
  const xw = ix.xwByPremise[premise];
  if (!xw) return { ok: false, reason: `Premise ${premise} not found in ref_id_crosswalk` };
  const spSas = ix.sasBySp[xw.ccb_sp_id] || [];
  if (!spSas.length) return { ok: false, xw, reason: `No CC&B SA on service point ${xw.ccb_sp_id}` };
  // Don't assume one SA per service point: pick the SA in force on the disconnect date.
  const sa = saCovering(spSas, onDate) ||
    spSas.filter(s => s.start_date <= onDate).sort((a, b) => b.start_date.localeCompare(a.start_date))[0] || spSas[0];
  return { ok: true, xw, sa, spSas, account: ix.accountById[sa.account_id] || null, meter: ix.meterById[xw.mdm_meter_id] || null };
}
const saCovering = (sas, d) => sas.find(s => s.start_date <= d && (!s.stop_date || s.stop_date >= d));

/** Step 3: the disconnect day is billable; the window starts the next day and ends the day before a completed reconnect. */
function disconnectWindow(ix, wo, premise) {
  const disconnectDate = dateOf(wo.completed_at);
  const reconnect = (ix.wosByPremise[premise || wo.oms_premise_id] || [])
    .filter(w => w.wo_type === 'RECONNECT' && w.status === 'COMPLETED' && w.completed_at > wo.completed_at)
    .sort((a, b) => a.completed_at.localeCompare(b.completed_at))[0] || null;
  return { disconnectDate, start: addDays(disconnectDate, 1),
           end: reconnect ? addDays(dateOf(reconnect.completed_at), -1) : null, reconnect };
}

/** Latest integration message for a work order (OMS → CC&B field-activity completion). */
const integrationMsg = (ix, woId) => (ix.msgsByWo[woId] || []).slice().sort((a, b) => b.received_at.localeCompare(a.received_at))[0] || null;
/** OPEN CC&B To Do entries raised against the work order or the SA. */
function openTodos(ix, woId, saId) {
  const seen = new Set(), out = [];
  for (const t of [...(ix.todosByEntity[woId] || []), ...(saId ? ix.todosBySa[saId] || [] : [])]) {
    if (t.status === 'OPEN' && !seen.has(t.todo_id)) { seen.add(t.todo_id); out.push(t); }
  }
  return out;
}

/**
 * Steps 4–8: compare the post-disconnect window with CC&B bills and MDM reads.
 * opt.scanStart / opt.scanEnd — scan range; opt.billCutoff — ignore bills run after this timestamp.
 */
function analyzeWindow(ix, wo, res, win, opt) {
  const first = maxStr(win.start, opt.scanStart);
  const last = win.end ? minStr(win.end, opt.scanEnd) : opt.scanEnd;
  const reads = ix.readsByMeter[res.xw.mdm_meter_id] || {};
  // Bills of every SA on this service point; FINAL or DISPUTED only (issued bills).
  const bills = res.spSas.flatMap(sa => (ix.billsBySa[sa.sa_id] || []).map(b => ({ b, sa })))
    .filter(({ b }) => (b.bill_status === 'FINAL' || b.bill_status === 'DISPUTED') && (!opt.billCutoff || b.bill_run_at <= opt.billCutoff));

  const per = new Map(), windowReads = [];
  let unbilledKwh = 0, unbilledDays = 0, unbilledFrom = null, unbilledTo = null;
  if (first <= last) {
    for (const d of dayRange(first, last)) {
      const rd = reads[d];
      if (rd) windowReads.push(rd);
      // If several SAs exist, use the bill whose SA dates cover this day.
      const cands = bills.filter(x => x.b.period_start <= d && d <= x.b.period_end);
      const hit = cands.find(x => x.sa.start_date <= d && (!x.sa.stop_date || x.sa.stop_date >= d)) || cands[0];
      if (hit) {
        let p = per.get(hit.b.bill_id);
        if (!p) { p = { bill: hit.b, sa: hit.sa, overlapDays: 0, from: d, to: d, phantomKwh: 0, actualKwh: 0 }; per.set(hit.b.bill_id, p); }
        p.overlapDays++; p.to = d;
        if (rd && rd._kwh > 0) {
          if (rd.read_quality === 'ESTIMATED') p.phantomKwh += rd._kwh;   // phantom consumption → credit
          else p.actualKwh += rd._kwh;                                    // billed actual after disconnect → RV
        }
      } else if (rd && rd.read_quality === 'ACTUAL' && rd._kwh > 0) {     // unbilled actual after disconnect → RV
        unbilledKwh += rd._kwh; unbilledDays++; unbilledFrom ||= d; unbilledTo = d;
      }
    }
  }

  const billLines = [...per.values()].map(p => billCredit(ix, wo, p));
  const sum = f => money(billLines.reduce((a, l) => a + f(l), 0));
  const consCredit = sum(l => l.consCredit), fixedCredit = sum(l => l.fixedCredit), fixedRetained = sum(l => l.fixedRetained);
  const credit = money(consCredit + fixedCredit);
  const phantomKwh = round1(billLines.reduce((a, l) => a + l.phantomKwh, 0));
  const billedActualKwh = round1(billLines.reduce((a, l) => a + l.actualKwh, 0));
  unbilledKwh = round1(unbilledKwh);
  const affected = billLines.filter(l => l.credit > 0 || l.actualKwh > 0);
  const isStop = STOP_SUBTYPES.has(wo.wo_subtype), isNonpay = wo.wo_subtype === 'NONPAY';

  // Step 7: rules fired
  const rules = [];
  if (billLines.length) rules.push('R1');
  if (phantomKwh > 0) rules.push('R2');
  if (isStop && res.sa.sa_status === 'ACTIVE') rules.push('R5');
  if (res.sa.stop_processed_at && billLines.some(l => l.bill.bill_run_at > wo.completed_at && l.bill.bill_run_at < res.sa.stop_processed_at)) rules.push('RT');
  if (billedActualKwh + unbilledKwh > 0) rules.push('RV');
  const flagged = credit > 0 || rules.includes('RV');

  // Step 8: severity
  let severity = null;
  if (credit > 0) {
    if (credit >= 250 || affected.length >= 2 || affected.some(l => l.bill.bill_status === 'DISPUTED')) severity = 'HIGH';
    else if (credit >= 25) severity = 'MEDIUM';
    else severity = 'LOW';
  } else if (rules.includes('RV')) severity = 'REVIEW';

  const msg = integrationMsg(ix, wo.wo_id);
  const todos = openTodos(ix, wo.wo_id, res.sa.sa_id);
  const a = {
    wo, res, sa: res.sa, xw: res.xw, account: res.account, meter: res.meter, win, isStop, isNonpay, first, last,
    billLines, consCredit, fixedCredit, fixedRetained, credit, phantomKwh, billedActualKwh, unbilledKwh, unbilledDays,
    unbilledFrom, unbilledTo, postDays: billLines.reduce((s, l) => s + l.overlapDays, 0) + unbilledDays,
    billsAffected: affected.length, rules, severity, flagged, msg, todos, readSummary: summarizeReads(windowReads),
  };
  a.causes = flagged ? probableCauses(a) : [];
  return a;
}

function summarizeReads(list) {
  if (!list.length) return null;
  const est = list.filter(r => r.read_quality === 'ESTIMATED'), act = list.filter(r => r.read_quality === 'ACTUAL');
  return { first: list[0], last: list[list.length - 1], count: list.length,
    estCount: est.length, estKwh: round1(est.reduce((s, r) => s + r._kwh, 0)),
    actCount: act.length, actKwh: round1(act.reduce((s, r) => s + r._kwh, 0)),
    vee: [...new Set(est.map(r => r.vee_rule).filter(Boolean))] };
}

/** Step 9: probable cause from the integration log for the work order plus the CC&B To Do queue. */
function probableCauses(a) {
  const out = [], m = a.msg;
  const todoNote = a.todos.length ? a.todos.map(t => `To Do ${t.todo_id} ${t.status}${t.assigned_to ? `, assigned to ${t.assigned_to}` : ', unassigned'}`).join('; ') : 'no open To Do';
  if (a.isNonpay) {
    out.push({ code: 'C4 + C5', label: 'C4 + C5 — non-pay keeps SA active by design; MDM estimated while disconnected' });
  } else if (m && m.status === 'SKIPPED') {
    out.push({ code: 'C1', label: `C1 — no integration mapping (${m.error_message || 'message skipped'})` });
  } else if (m && m.status === 'ERROR' && /cross[\s-]?ref/i.test(m.error_message)) {
    out.push({ code: 'C3', label: `C3 — ID mismatch (${m.error_message})` });
  } else if (m && m.status === 'ERROR') {
    out.push({ code: 'C2', label: `C2 — integration failure (${m.error_message || 'error'}); ${todoNote}` });
  } else if (m && m.status === 'SUCCESS' && m.processed_at && a.billLines.some(l => m.processed_at > l.bill.bill_run_at)) {
    const l = a.billLines.find(x => m.processed_at > x.bill.bill_run_at);
    out.push({ code: 'C6', label: `C6 — bill ran before stop was processed (bill run ${l.bill.bill_run_at}, stop processed ${m.processed_at})` });
  } else if (!m && a.isStop && a.credit > 0) {
    out.push({ code: 'NOMSG', label: 'No integration message found for this work order' });
  }
  if (a.rules.includes('RV') && !out.length) out.push({ code: 'TAMPER', label: 'Possible failed disconnect or tamper — dispatch field check' });
  if (!out.length) out.push({ code: 'OTHER', label: 'Unclassified — manual review' });
  return out;
}

/* =========================================================================
   SECTION 4 — CREDIT CALCULATION
   ========================================================================= */
/**
 * Step 6, per bill:
 *  consumption credit = round(phantom kWh × tariff rate_per_kwh, 2)
 *  fixed credit       = round(overlapping billed days × fixed_daily_charge, 2) for STOP_SERVICE / MOVE_OUT when the
 *                       tariff says fixed charges stop on stop-service (Y);
 *  NONPAY with fixed_continues_on_nonpay = Y → fixed amount shown as "retained per tariff", not credited.
 */
function billCredit(ix, wo, p) {
  const t = ix.tariff[p.sa.tariff_code];
  const rate = t ? num(t.rate_per_kwh) : num(p.bill.rate_per_kwh);           // fall back to the bill's own rate
  const fixedDaily = t ? num(t.fixed_daily_charge) : num(p.bill.fixed_daily_charge);
  let creditFixed;
  if (STOP_SUBTYPES.has(wo.wo_subtype)) creditFixed = !t || t.fixed_stops_on_stop_service === 'Y';
  else if (wo.wo_subtype === 'NONPAY') creditFixed = !!t && t.fixed_continues_on_nonpay !== 'Y';
  else creditFixed = !t || t.fixed_stops_on_stop_service === 'Y';          // other subtypes behave like a stop
  const phantomKwh = round1(p.phantomKwh);
  const consCredit = money(phantomKwh * rate);
  const fixedAmt = money(p.overlapDays * fixedDaily);
  const fixedCredit = creditFixed ? fixedAmt : 0;
  return { ...p, tariff: t, rate, fixedDaily, phantomKwh, actualKwh: round1(p.actualKwh), consCredit, fixedAmt, fixedCredit,
           fixedRetained: creditFixed ? 0 : fixedAmt, credit: money(consCredit + fixedCredit) };
}

/** Plain-English recommended action for a back-scan finding. */
function recommendAction(a) {
  const s = [], has = r => a.rules.includes(r), code = a.causes[0] && a.causes[0].code;
  const n = a.billLines.filter(l => l.credit > 0).length;
  if (has('R5')) s.push(`place bill hold on ${a.sa.sa_id} and process the stop effective ${a.win.disconnectDate}`);
  if (has('RT')) {
    const ids = a.billLines.filter(l => l.bill.bill_run_at < a.sa.stop_processed_at).map(l => l.bill.bill_id).join(', ');
    s.push(`cancel and rebill ${ids} as a final bill ending ${a.win.disconnectDate}`);
  }
  if (a.credit > 0) {
    if (!a.isNonpay) s.push(`credit ${fmtMoney(a.credit)} (${plural(n, 'bill')})`);
    else s.push(`credit ${fmtMoney(a.credit)} of estimated consumption; fixed charges ${fmtMoney(a.fixedRetained)} retained per tariff`);
  }
  if (a.isNonpay && has('R2')) s.push('suppress MDM estimation while a non-pay disconnect is active');
  if (code === 'C1') s.push(`add a CC&B mapping for wo_subtype ${a.wo.wo_subtype}`);
  if (code === 'C2' && a.todos.length) s.push(`assign and work ${a.todos.map(t => t.todo_id).join(', ')}`);
  if (code === 'C6') s.push('review the bill-run cut-off against the stop-processing queue');
  const disputed = a.billLines.find(l => l.bill.bill_status === 'DISPUTED');
  if (disputed) s.push(`resolve the open dispute on ${disputed.bill.bill_id}`);
  if (has('RV')) s.push(`dispatch a field check to confirm the disconnect and inspect for tamper — ${fmtKwh(a.billedActualKwh + a.unbilledKwh)} kWh of actual consumption recorded ${a.unbilledFrom ? `${a.unbilledFrom} to ${a.unbilledTo}` : 'after the disconnect'}${a.credit > 0 ? '' : '; no credit due'}`);
  if (a.severity === 'HIGH') s.push('route to escalation DRI');
  const txt = s.join('; ') || 'Review manually';
  return txt.charAt(0).toUpperCase() + txt.slice(1) + '.';
}

/** Step 2 (unresolved): near-match suggestions and "potential exposure if linked". */
function buildUnmatched(ix, wo, reason, scan) {
  const recorded = wo.oms_premise_id;
  const folded = foldLookalikes(recorded);
  const suggestions = Object.keys(ix.xwByPremise)
    .map(p => ({ premise: p, distance: levenshtein(foldLookalikes(p), folded), raw: levenshtein(p, recorded) }))
    .filter(c => c.distance <= 1)
    .sort((a, b) => a.distance - b.distance || a.raw - b.raw || a.premise.localeCompare(b.premise))
    .map(c => ({ ...c, note: diffNote(recorded, c.premise) }));
  const um = { wo, recorded, reason, suggestions, suggestion: suggestions[0] || null, exposure: null, msg: integrationMsg(ix, wo.wo_id) };
  if (um.suggestion) {
    const res = resolvePremise(ix, um.suggestion.premise, dateOf(wo.completed_at));
    if (res.ok) {
      const a = analyzeWindow(ix, wo, res, disconnectWindow(ix, wo, um.suggestion.premise), scan);
      a.causes = [{ code: 'C3', label: `C3 — ID mismatch${um.msg && um.msg.error_message ? ` (${um.msg.error_message})` : ''}` }];
      um.exposure = { a, consCredit: a.consCredit, fixedCredit: a.fixedCredit, total: a.credit };
    }
  }
  return um;
}
function diffNote(a, b) {
  let txt = `${levenshtein(a, b)}-character difference`;
  if (a.length === b.length) {
    const pos = [];
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) pos.push(`'${a[i]}' vs '${b[i]}' at position ${i + 1}`);
    if (pos.length) txt += ': ' + pos.join(', ');
  }
  if (foldLookalikes(a) === foldLookalikes(b)) txt += ' (look-alike characters)';
  return txt;
}

const defaultScanRange = ix => ({ scanStart: ix.minBill, scanEnd: ix.maxBill });

/** Main entry: back-scan over the scan range and daily check as of opts.asOf. */
function detect(ix, opts) {
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const t0 = now();
  const asOf = opts.asOf, asOfEnd = asOf + ' 23:59';
  const scan = { scanStart: opts.scanStart || ix.minBill, scanEnd: opts.scanEnd || ix.maxBill };
  const wos = Object.values(ix.wosByPremise).flat();

  // Step 1: completed DISCONNECT work orders only.
  const completed = wos.filter(w => w.wo_type === 'DISCONNECT' && w.status === 'COMPLETED' && w.completed_at)
    .sort((a, b) => a.completed_at.localeCompare(b.completed_at));
  const back = { findings: [], unmatched: [], scanned: completed.length, matched: 0, ...scan };
  const daily = { asOf, holds: [], unmatched: [], excluded: [], scanned: 0, matched: 0, nextRun: nextBillRun(ix, asOf) };

  for (const wo of completed) {
    const dDate = dateOf(wo.completed_at);
    const inDaily = wo.completed_at <= asOfEnd;
    if (inDaily) daily.scanned++;
    const res = resolvePremise(ix, wo.oms_premise_id, dDate);
    if (!res.ok) {
      const um = buildUnmatched(ix, wo, res.reason, scan);
      back.unmatched.push(um);
      if (inDaily) daily.unmatched.push(um);
      continue;
    }
    back.matched++; if (inDaily) daily.matched++;
    const win = disconnectWindow(ix, wo);

    // ---- Back-scan ----
    const a = analyzeWindow(ix, wo, res, win, scan);
    if (a.flagged) back.findings.push(makeFinding(a));

    // ---- Daily check: STOP_SERVICE / MOVE_OUT (not NONPAY) whose SA is still active at the end of D ----
    if (!inDaily) continue;
    const common = { key: wo.wo_id, wo, sa: res.sa, accountId: res.sa.account_id, saId: res.sa.sa_id,
      customer: res.account ? res.account.customer_name : res.sa.account_id, cls: res.account ? res.account.customer_class : '',
      tariff: res.sa.tariff_code, disconnectDate: dDate, daysSince: daysBetween(dDate, asOf) };
    if (wo.wo_subtype === 'NONPAY') { daily.excluded.push(common); continue; }
    const stillActive = res.sa.sa_status === 'ACTIVE' || (res.sa.stop_processed_at && res.sa.stop_processed_at > asOfEnd);
    if (!stillActive) continue;
    const toDate = analyzeWindow(ix, wo, res, win, { scanStart: scan.scanStart, scanEnd: minStr(asOf, scan.scanEnd), billCutoff: asOfEnd });
    const msg = integrationMsg(ix, wo.wo_id), todos = openTodos(ix, wo.wo_id, res.sa.sa_id);
    const saNote = res.sa.sa_status === 'ACTIVE' ? 'ACTIVE' : `ACTIVE as of ${asOf} (stop processed ${res.sa.stop_processed_at})`;
    daily.holds.push({ ...common, a: toDate, msg, todos, saNote, creditToDate: toDate.credit, nextRun: daily.nextRun,
      action: `Hold before next bill run${daily.nextRun ? ` (${daily.nextRun})` : ''}: place bill hold on ${res.sa.sa_id} and process the stop effective ${dDate}` +
        (todos.length ? `; work ${todos.map(t => t.todo_id).join(', ')}` : '') +
        (toDate.credit > 0 ? `; ${fmtMoney(toDate.credit)} already billed for post-disconnect days needs crediting` : '') + '.' });
  }
  back.totalCredit = money(back.findings.reduce((s, f) => s + f.credit, 0));
  return { back, daily, asOf, scan, elapsedMs: now() - t0 };
}

function makeFinding(a) {
  return {

/* =========================================================================
   SECTION 5 — SELF-TEST against answer_key.csv
   ========================================================================= */
const MONEY_TOL = 0.01 + 1e-9;
/** The answer key's daily column name carries its as-of date, e.g. daily_check_2026_11_02. */
function answerKeyAsOf(headers) {
  const h = (headers || []).find(x => /^daily_check_\d{4}_\d{2}_\d{2}$/.test(x));
  return h ? { col: h, asOf: h.slice(12).replace(/_/g, '-') } : null;
}
/** Case codes (E1…, N1…) by account_id, matched on customer_name. */
function caseLabels(files) {
  const out = {};
  const key = files['answer_key.csv'], accts = files['ccb_accounts.csv'];
  if (!key || !accts) return out;
  const byName = {};
  for (const a of accts.rows) (byName[a.customer_name.trim().toLowerCase()] ||= []).push(a.account_id);
  for (const r of key.rows) for (const id of byName[r.customer_name.trim().toLowerCase()] || []) out[id] = r.case;
  return out;
}

function runSelfTest(d) {
  const key = d.files['answer_key.csv'];
  if (!key) return { available: false, reason: 'answer_key.csv not present in this dataset' };
  const ak = answerKeyAsOf(key.headers);
  if (!ak) return { available: false, reason: 'answer_key.csv has no daily_check_YYYY_MM_DD column' };
  const ix = d.ix, r = detect(ix, { asOf: ak.asOf, ...defaultScanRange(ix) });
  const byName = {};
  for (const a of d.files['ccb_accounts.csv'].rows) (byName[a.customer_name.trim().toLowerCase()] ||= []).push(a.account_id);
  const listed = new Set();
  const findingFor = ids => r.back.findings.find(f => ids.includes(f.accountId));
  const unmatchedFor = (list, ids) => list.find(u => u.exposure && ids.includes(u.exposure.a.sa.account_id));
  const backRows = [], dailyRows = [];

  for (const k of key.rows) {
    const ids = byName[k.customer_name.trim().toLowerCase()] || [];
    ids.forEach(id => listed.add(id));
    const f = findingFor(ids), u = unmatchedFor(r.back.unmatched, ids);
    const total = num(k.credit_total);
    const actualBack = f ? `FINDING · ${f.severity} · ${fmtMoney(f.credit)}` : u ? `UNMATCHED · potential ${fmtMoney(u.exposure.total)}` : 'not flagged';
    let expected, pass;
    switch (k.back_scan_result) {
      case 'FINDING':
        expected = `FINDING · ${k.severity} · ${fmtMoney(total)}`;
        pass = !!f && f.severity === k.severity && Math.abs(f.credit - total) <= MONEY_TOL; break;
      case 'UNMATCHED':
        expected = `UNMATCHED · potential ${fmtMoney(total)}`;
        pass = !!u && !f && Math.abs(u.exposure.total - total) <= MONEY_TOL; break;
      case 'DAILY_CHECK_ONLY': expected = 'not a finding (daily check only)'; pass = !f; break;
      default: expected = 'not a finding'; pass = !f; break;
    }
    if (!ids.length) pass = false;
    backRows.push({ code: k.case, name: k.customer_name, expected, actual: ids.length ? actualBack : 'customer not found in ccb_accounts.csv', pass });

    const hold = r.daily.holds.find(h => ids.includes(h.accountId)), du = unmatchedFor(r.daily.unmatched, ids);
    const exp = k[ak.col];
    const act = hold ? 'HOLD' : du ? 'UNMATCHED' : 'NONE';
    dailyRows.push({ code: k.case, name: k.customer_name, expected: exp, actual: ids.length ? act : 'customer not found', pass: !!ids.length && act === exp });
  }
  // Anything flagged that the answer key doesn't list is a failure.
  const extraF = r.back.findings.filter(f => !listed.has(f.accountId));
  backRows.push({ code: '—', name: 'Accounts not in answer key', expected: 'none flagged',
    actual: extraF.length ? extraF.map(f => `${f.customer} (${f.severity})`).join(', ') : 'none flagged', pass: !extraF.length });
  const extraU = r.back.unmatched.filter(u => !(u.exposure && listed.has(u.exposure.a.sa.account_id)));
  if (extraU.length) backRows.push({ code: '—', name: 'Unmatched not in answer key', expected: 'none', actual: extraU.map(u => u.wo.wo_id).join(', '), pass: false });
  const extraH = r.daily.holds.filter(h => !listed.has(h.accountId));
  dailyRows.push({ code: '—', name: 'Accounts not in answer key', expected: 'none held',
    actual: extraH.length ? extraH.map(h => h.customer).join(', ') : 'none held', pass: !extraH.length });
  const totalExpected = money(key.rows.filter(k => k.back_scan_result === 'FINDING').reduce((s, k) => s + num(k.credit_total), 0));
  backRows.push({ code: '∑', name: 'Total credit owed', expected: fmtMoney(totalExpected), actual: fmtMoney(r.back.totalCredit), pass: Math.abs(totalExpected - r.back.totalCredit) <= MONEY_TOL });

  return { available: true, asOf: ak.asOf, scan: defaultScanRange(ix),
    backscan: { rows: backRows, pass: backRows.every(x => x.pass) }, daily: { rows: dailyRows, pass: dailyRows.every(x => x.pass) } };
}

/** Turn a dataset's raw files into a ready-to-use model (index, labels, validation). */
function prepareDataset(meta, files) {
  const v = validateFiles(files);
  const d = { ...meta, files, errors: v.errors, warnings: v.warnings };
  d.fileCount = Object.keys(files).length;
  d.rowCount = Object.values(files).reduce((s, f) => s + f.rows.length, 0);
  if (!v.errors.length) { d.ix = buildIndex(files); d.labels = caseLabels(files); d.selfTest = runSelfTest(d); }
  return d;
}

/** Fetch + parse every allowed file for one dataset (cached in memory; no browser storage). */
async function loadDataset(meta) {
  if (source.cache.has(meta.id)) return source.cache.get(meta.id);
  const files = {};
  const names = FILE_NAMES.filter(n => meta.present.includes(n));
  await Promise.all(names.map(async name => {

      if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
      text = await r.text();

}
/** Fallback: discover datasets from a folder picked with <input webkitdirectory>. */
function discoverLocal(fileList) {

    const folderName = dir.split('/').pop();

    const js = JSON.stringify(data);
    if (js === S.last[key]) return;
    S.last[key] = js;
    if (editing()) { if (def.partial) def.partial(data, S.route.id); return; }
    const y = window.scrollY;
    $('#view').innerHTML = def.render(data, S.route.id);
    if (def.after) def.after(data, S.route.id);
    window.scrollTo(0, y);
  } catch (e) { /* ignore transient */ }
}
function startPolling() { stopPolling(); S.pollTimer = setInterval(refresh, 1200); refresh(); }
function stopPolling() { clearInterval(S.pollTimer); S.pollTimer = null; }
async function switchContext(kind, value) {
  const prev = kind === 'dataset' ? S.dsId : S.scId;
  if (kind === 'dataset') {
    S.dsId = value; state.dsId = value;
    const ds = curDs();
    if (!ds.scenarios.some(s => s.scenario_id === S.scId)) S.scId = (ds.scenarios.find(s => s.kind === 'REPLAY') || ds.scenarios[0]).scenario_id;
    state.detail = null;
  } else S.scId = value;
  try { await api('/api/context', { method: 'POST', body: { changed: kind, previous: prev } }); } catch (e) { /* logged best-effort */ }
  S.last = {}; S.sandbox = null;
  renderHeader();
  if (S.route.screen === 'case') go('cases'); else route();
}
async function act(caseId, action, payload) {
  S.busy = true;
  try {
    const r = await api(`/api/cases/${encodeURIComponent(caseId)}/action`, { method: 'POST', body: Object.assign({ action }, payload || {}) });
    toast(`${action.replace(/_/g, ' ').toLowerCase()} — case is now ${r.case.state.replace(/_/g, ' ')}`);
    return r;
  } catch (e) { toast(e.message, true); throw e; }
  finally { S.busy = false; S.last = {}; await route(true); refresh(); }
}

function eventDetail(e) {
  const a = e.after || {};
  const bits = [];
  if (e.before && e.before.state && a.state) bits.push(`${e.before.state} → ${a.state}`);
  else if (a.state) bits.push(a.state);
  if (e.action === 'AGENT_TOOL_CALL') bits.push(`${a.ok === false ? '✗ ' : ''}${a.result || ''}`);
  else if (a.outcome) bits.push(a.outcome + (a.rules && a.rules.length ? ' ' + a.rules.join(',') : ''));
  else if (a.option_id) bits.push(a.label || a.option_id);
  else if (a.probable_cause) bits.push(`${a.probable_cause} → ${a.recommended_option} (conf. ${a.confidence})`);
  else if (a.detail) bits.push(a.detail);
  else if (a.step) bits.push(`${a.step}: ${a.check || ''}`);
  else if (a.mode) bits.push(`${a.mode} ${a.amount != null ? fmtMoney(a.amount) : ''}`);
  else if (a.amount != null) bits.push(fmtMoney(a.amount));
  if (e.reason) bits.push('“' + e.reason + '”');
  return esc(bits.join(' · ')).slice(0, 400);
}

/* ---------- Case detail ---------- */
function impactText(i) {
  if (!i) return '—';
  switch (i.kind) {
    case 'DRAFT_BILL': return `<span class="impact">${fmtMoney(i.before)}<span class="arrow">→</span><span class="after">${i.action === 'CANCEL' ? 'cancelled' : fmtMoney(i.after)}</span></span>${i.reduction ? ` <span class="sub-line">−${fmtMoney(i.reduction)}${i.fixed_retained ? ` · fixed ${fmtMoney(i.fixed_retained)} retained` : ''}</span>` : ''}`;
    case 'CREDIT': return `<span class="impact">credit <span class="after">${fmtMoney(i.credit)}</span></span><span class="sub-line">${esc(i.bill_ids.join(', '))} · GL ${esc(i.gl_period || '')}</span>`;
    case 'REVENUE_PROTECTION': return `<span class="impact">${fmtKwh(i.unbilled_kwh)} kWh unbilled</span><span class="sub-line">≈ ${fmtMoney(i.unbilled_value)} at tariff</span>`;
    case 'ACCOUNT': return `<span class="impact">stop SA effective ${esc(i.stop_effective)}</span><span class="sub-line">protects the next bill</span>`;
    case 'PENDING': return `<span class="impact">${fmtMoney(i.before)} held pending field</span>`;
    default: return '<span class="faint">no financial change</span>';
  }
}
function statesLine(c) {
  const seen = new Set(c.history.map(h => h.state));
  const curIdx = CASE_STATES.indexOf(c.state);
  const optional = ['MASTER_DATA_REVIEW', 'FIELD_VERIFICATION', 'FINANCE_APPROVAL', 'REGULATORY_REVIEW', 'READY_TO_RELEASE'];
  const lastSeenIdx = Math.max(...[...seen].map(s => CASE_STATES.indexOf(s)));
  const chips = CASE_STATES.map((s, i) => {
    const cls = s === c.state ? 'cur' : seen.has(s) ? 'done' : (optional.includes(s) && i < lastSeenIdx) ? 'skip' : '';
    return `<span class="${cls}">${esc(s.replace(/_/g, ' ').toLowerCase())}</span>`;
  }).join('');
  const side = ['RETURNED_TO_DRI', 'CLOSED_NO_ACTION'].filter(s => seen.has(s)).map(s => `<span class="${s === c.state ? 'cur' : 'done'}" style="${s === 'RETURNED_TO_DRI' ? 'border-color:var(--high);color:' + (s === c.state ? '#fff;background:var(--high)' : 'var(--high)') : ''}">${esc(s.replace(/_/g, ' ').toLowerCase())}</span>`).join('');
  return `<div class="states-line" id="statesLine">${chips}${side}</div>`;
}

  } else if (acts.includes('APPROVE_PLAN')) {

    out.push(`<p>The execution agent proposes <b>${p.steps.length}</b> step(s) for <b>${esc(p.label)}</b>. The server validated that every step belongs to the approved playbook; the agent may only run the next approved step.</p>

  } else if (c.state === 'PLAN_APPROVAL' && !c.plan) {

  if (c.state === 'READY_TO_RELEASE' && lvl('billrun') === 'A' && c.draft_bill_id) {

  }

    case 'audit-clear': S.auditF = {}; S.auditVerify = null; route(true); break;
    case 'audit-verify': try { S.auditVerify = await api('/api/audit/verify', { method: 'POST', body: {} }); route(true); } catch (err) { toast(err.message, true); } break;
    case 'audit-export': try { const qs = new URLSearchParams(Object.entries(S.auditF).filter(([, v]) => v)).toString(); exportCSV('audit_log.csv', await api('/api/audit/export?' + qs, { raw: true })); } catch (err) { toast(err.message, true); } break;
    case 'run-server-test': S.serverTest = null; runServerTest(); break;
    case 'reset-current': if (confirm(`Reset case state and sandbox for ${S.scId}? The audit log is kept.`)) { await post('/api/demo/reset', { scope: 'current' }, 'Demo state reset for ' + S.scId); } break;
    case 'reset-all': if (confirm('Reset case state and sandbox for every scenario? The audit log is kept.')) { await post('/api/demo/reset', { scope: 'all' }, 'All demo state reset'); } break;
    case 'arm-failure': await post('/api/demo/inject_failure', { enabled: true }, 'Armed: the next execution step will fail'); break;
    case 'disarm-failure': await post('/api/demo/inject_failure', { enabled: false }, 'Injected failure disarmed'); break;
    case 'dismiss-banner': state.banner = null; { const b = $('#banner'); if (b) b.innerHTML = ''; } break;
    case 'close-drawer': state.detail = null; renderDrawer(); break;
    case 'export-findings': exportFindings(); break;
    case 'export-holds': exportHolds(); break;
    case 'choose-folder': $('#folderInput').click(); break;
    case 'page-prev': state.explorer.page = Math.max(0, state.explorer.page - 1); $('#view').innerHTML = explorerHtml(); break;
    case 'page-next': state.explorer.page++; $('#view').innerHTML = explorerHtml(); break;
    case 'close-modal': $('#modal').hidden = true; break;
    case 'try-download': try { triggerDownload($('#modal').dataset.name, $('#csvText').value); } catch (err) { /* blocked */ } break;
    case 'copy-csv': { const ta = $('#csvText'); ta.select(); const done = () => { t.textContent = 'Copied ✓'; setTimeout(() => { t.textContent = 'Copy to clipboard'; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); } break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) { $('#modal').hidden = true; return; } if (state.detail) { state.detail = null; renderDrawer(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-open]')) { e.preventDefault(); state.detail = findCtx(e.target.dataset.open, e.target.dataset.key); renderDrawer(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'dsSelect') switchContext('dataset', t.value);
  else if (t.id === 'scSelect') switchContext('scenario', t.value);
  else if (t.id === 'asOf') { if (t.value) { state.asOf = t.value; run(); } }
  else if (t.id === 'scanStart' || t.id === 'scanEnd') { const s = $('#scanStart').value, en = $('#scanEnd').value; if (s && en && s <= en) { state.scan = { scanStart: s, scanEnd: en }; state.scanTouched = true; run(); } }
  else if (t.id === 'labelsToggle' || t.id === 'hdrLabels') {
    state.labels = t.checked; $('#hdrLabels').checked = t.checked;
    if (S.route.screen === 'backscan') $('#view').innerHTML = backscanHtml(); else { S.last = {}; route(true); }
  }
  else if (t.id === 'sevFilter') { state.sevFilter = t.value; renderResults(); }
  else if (t.id === 'causeFilter') { state.causeFilter = t.value; renderResults(); }
  else if (t.id === 'filePick') { state.explorer.file = t.value; state.explorer.q = ''; state.explorer.page = 0; $('#view').innerHTML = explorerHtml(); }
  else if (t.id === 'folderInput' && t.files && t.files.length) onFolderChosen(t.files);
});
let searchTimer = null;
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('[data-track]')) e.target.dataset.dirty = '1';
  if (e.target.id !== 'explorerQ') return;
  state.explorer.q = e.target.value; state.explorer.page = 0;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { const pos = e.target.selectionStart; $('#view').innerHTML = explorerHtml(); const inp = $('#explorerQ'); inp.focus(); inp.setSelectionRange(pos, pos); }, 150);
});

boot();
</script>
</body>
</html>
